services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vatmate-app
    restart: unless-stopped
    working_dir: /var/www/html
    ports:
      - "80:80"
      - "6001:6001"
    expose:
      - "80"
      - "6001"
    volumes:
      - storage_data:/var/www/html/storage
    environment:
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      APP_ENV: production
      APP_DEBUG: "false"

      DB_CONNECTION: pgsql
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-vatmate}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      QUEUE_CONNECTION: redis
      BROADCAST_CONNECTION: reverb
      REDIS_PREFIX: vatmate_

volumes:
  storage_data:
