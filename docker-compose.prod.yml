services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vatmate-app
    restart: unless-stopped
    working_dir: /var/www/html
    labels:
      - "com.github.nginx-proxy.websocket-services=reverb.vatmate.org"
    ports:
      - "8081:80"
    expose:
      - "80"
      - "6001"
    volumes:
      - storage_data:/var/www/html/storage
    environment:
      APP_KEY: ${APP_KEY}

      DB_CONNECTION: pgsql
      DB_HOST: postgres-global
      DB_PORT: 5432
      DB_DATABASE: vatmate
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      REDIS_HOST: redis-global
      QUEUE_CONNECTION: redis
      BROADCAST_CONNECTION: reverb
      REDIS_PREFIX: vatmate_

      VIRTUAL_HOST: vatmate.org,www.vatmate.org
      LETSENCRYPT_HOST: vatmate.org,www.vatmate.org
      LETSENCRYPT_EMAIL: niyamulahsan@gmail.com
    networks:
      - nginx-proxy
      - infra

volumes:
  storage_data:

networks:
  nginx-proxy:
    external: true
  infra:
    external: true
