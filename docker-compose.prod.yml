services:
  nginx-proxy:
    image: jwilder/nginx-proxy
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - certs:/etc/nginx/certs
      # - vhost:/etc/nginx/vhost.d
      - ./docker/nginx-vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
    labels:
      com.github.nginx-proxy.nginx: "true"
    networks:
      - nginx-proxy

  letsencrypt:
    image: jrcs/letsencrypt-nginx-proxy-companion
    container_name: nginx-letsencrypt
    restart: unless-stopped
    environment:
      NGINX_PROXY_CONTAINER: nginx-proxy
      DEFAULT_EMAIL: niyamulahsan@gmail.com
      # ACME_CA_URI: https://acme-staging-v02.api.letsencrypt.org/directory  # ✅ keep staging for now
    depends_on:
      - nginx-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - acme:/etc/acme.sh
    networks:
      - nginx-proxy
      
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-app
    restart: unless-stopped
    working_dir: /var/www/html
    labels:
      - "com.github.nginx-proxy.websocket-services=reverb.vatmate.org"
    expose:
      - "80"
      - "6001"
    ports:
      - "6001:6001"
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      - mysql
      - redis
    environment:
      APP_KEY: ${APP_KEY}
      DB_HOST: mysql
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      BROADCAST_CONNECTION: reverb
      VIRTUAL_HOST: vatmate.org,www.vatmate.org,reverb.vatmate.org
      LETSENCRYPT_HOST: vatmate.org,www.vatmate.org,reverb.vatmate.org
      LETSENCRYPT_EMAIL: niyamulahsan@gmail.com
    networks:
      - laravel
      - nginx-proxy

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    networks:
      - laravel

  redis:
    image: redis:alpine
    container_name: redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    networks:
      - laravel

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      VIRTUAL_HOST: pma.vatmate.org
      VIRTUAL_PORT: 80
      LETSENCRYPT_HOST: pma.vatmate.org
      LETSENCRYPT_EMAIL: niyamulahsan@gmail.com
    depends_on:
      - mysql
    networks:
      - laravel
      - nginx-proxy

volumes:
  mysql_data:
    name: mysql_data
  redis_data:
    name: redis_data
  storage_data:
    name: storage_data
  acme:
  certs:
  vhost:
  html:

networks:
  nginx-proxy:
    external: true
    name: nginx-proxy
  laravel:
    driver: bridge
