[supervisord]
nodaemon=true
logfile=/var/log/supervisord/supervisord.log
pidfile=/var/run/supervisord.pid

; --------------------------------------------------
; One-time storage link
; --------------------------------------------------
[program:storage-link]
command=/bin/bash -c "\
  rm -rf public/storage && \
  php artisan storage:link && \
  chown -R www-data:www-data storage public/storage"
directory=/var/www/html
autostart=true
autorestart=false
priority=1
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr

; --------------------------------------------------
; PHP-FPM
; --------------------------------------------------
[program:php-fpm]
command=/usr/local/sbin/php-fpm -F
autostart=true
autorestart=true
priority=90
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stopasgroup=true
killasgroup=true

; --------------------------------------------------
; NGINX
; --------------------------------------------------
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=100
stdout_logfile=/var/log/nginx/supervisor_stdout.log
stderr_logfile=/var/log/nginx/supervisor_stderr.log
stopasgroup=true
killasgroup=true

; --------------------------------------------------
; Reverb (WebSocket)
; --------------------------------------------------
[program:reverb]
startsecs=5
command=/usr/local/bin/php artisan reverb:start --host=0.0.0.0 --port=6001
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
stdout_logfile=/var/log/reverb.log
stderr_logfile=/var/log/reverb.err.log
stopasgroup=true
killasgroup=true

; --------------------------------------------------
; Horizon
; --------------------------------------------------
[program:horizon]
startsecs=5
command=/usr/local/bin/php artisan horizon
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
stdout_logfile=/var/log/horizon.log
stderr_logfile=/var/log/horizon.err.log
stopasgroup=true
killasgroup=true

; --------------------------------------------------
; Scheduler
; --------------------------------------------------
[program:scheduler]
startsecs=5
command=/usr/local/bin/php artisan schedule:work
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
stdout_logfile=/var/log/scheduler.log
stderr_logfile=/var/log/scheduler.err.log
stopasgroup=true
killasgroup=true
