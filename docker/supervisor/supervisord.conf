[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord/supervisord.log
logfile_maxbytes=50MB
logfile_backups=3
loglevel=info
pidfile=/var/run/supervisord.pid

[program:storage-link]
command=/bin/bash -c "\
  rm -rf /var/www/html/public/storage && \
  php artisan storage:link && \
  chown -R www-data:www-data /var/www/html/storage /var/www/html/public/storage"
directory=/var/www/html
autostart=true
autorestart=false         ; Only run once at start
priority=1
startsecs=0
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr

[program:apache2]
command=/bin/bash -c "rm -f /var/run/apache2/apache2.pid && /usr/sbin/apache2ctl -D FOREGROUND"
autostart=true
autorestart=true
priority=100
stdout_logfile=/var/log/apache2/supervisor_stdout.log
stderr_logfile=/var/log/apache2/supervisor_stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stopasgroup=true
killasgroup=true

[program:reverb]
command=/usr/local/bin/php /var/www/html/artisan reverb:start --host=0.0.0.0 --port=6001
directory=/var/www/html
autostart=true
autorestart=true
user=root
stdout_logfile=/var/log/reverb.log
stderr_logfile=/var/log/reverb.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stopasgroup=true
killasgroup=true

[program:horizon]
command=/usr/local/bin/php /var/www/html/artisan horizon
directory=/var/www/html
autostart=true
autorestart=true
user=root
stdout_logfile=/var/log/horizon.log
stderr_logfile=/var/log/horizon.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stopasgroup=true
killasgroup=true

[program:scheduler]
command=/usr/local/bin/php /var/www/html/artisan schedule:work
directory=/var/www/html
autostart=true
autorestart=true
user=root
stdout_logfile=/var/log/scheduler.log
stderr_logfile=/var/log/scheduler.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stopasgroup=true
killasgroup=true
