<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dash</title>
    <link rel="icon" type="image/x-icon" href="../assets/images/favicon/favicon.ico" />
    <script src="../assets/js/darkLightBeforeCss.js"></script>
    <link href="../assets/css/styles.css" rel="stylesheet" />
  </head>
  <body class="theme-light">
    <div id="app">
      <div class="wrapper">
        <div class="container position-absolute start-50 top-50 translate-middle">
          <div class="auth">
            <div class="card card-body border-0">
              <div class="d-block mb-4">
                <h3 class="m-0 text-uppercase text-center fw-semibold">vatmate</h3>
              </div>
              <p class="text-center alert alert-danger text-danger py-1">Invalid Credential</p>
              <form>
                <div class="mb-4">
                  <label for="email" class="form-label">Email</label>
                  <input type="email" class="form-control" id="email" placeholder="Enter your email..." aria-describedby="emailHelp" />
                </div>
                <div class="mb-4">
                  <label for="password" class="form-label">Password</label>
                  <div class="input-group">
                    <input type="password" class="form-control" id="password" placeholder="········" />
                    <button type="button" class="input-group-text px-3" data-toggle="togglePassword" aria-label="Toggle password visibility">
                      <i class="bi bi-eye-slash"></i>
                    </button>
                  </div>
                </div>
                <div class="mb-4 d-flex align-items-center justify-content-between">
                  <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="remember-me" />
                    <label class="form-check-label" for="remember-me">Remember me</label>
                  </div>
                  <a href="#" class="text-decoration-none">Forget Password?</a>
                </div>
                <button type="submit" class="btn btn-primary w-100">
                  <span>Login</span>
                  <i class="bi bi-box-arrow-in-right"></i>
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="../assets/js/main.js"></script>
  </body>
</html>
